<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>감량 대시보드</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

.value{
    font-size:32px;
    font-weight:bold;
    color:#38bdf8;
}
</style>
</head>

<body>

<h1>🏃 2026년 8월 감량 대시보드</h1>

<div class="card">
    <h2>현재 체중</h2>
    <div class="value">76.57kg</div>
</div>

<div class="card">
    <h2>목표 체중</h2>
    <div class="value">73.0kg</div>
</div>

<div class="card">
    <h2>러닝 누적</h2>
    <div class="value">22.1km</div>
</div>

</body>
</html>
